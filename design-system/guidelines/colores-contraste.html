<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--fondo)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--verde-1);color:#fff;padding:16px;height:76px;display:flex;align-items:center;font-family:var(--fuente-titulos);font-weight:600;font-size:24px;line-height:1;white-space:nowrap;overflow:hidden">Agenda</div><div class="sl-cuerpo-ui"><b class="sl-etiqueta" style="color:var(--exito)">Sí</b> Blanco sobre verde-1 a 24px o más</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--accion);color:#fff;padding:16px;height:76px;display:flex;align-items:center;font-family:var(--fuente-titulos);font-weight:600;font-size:16px">Agendá una llamada</div><div class="sl-cuerpo-ui"><b class="sl-etiqueta" style="color:var(--exito)">Sí</b> Botones y enlaces: accion</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--verde-2);color:var(--tinta);padding:16px;height:76px;display:flex;align-items:center;font-family:var(--fuente-titulos);font-weight:600;font-size:16px">Agendá una llamada</div><div class="sl-cuerpo-ui"><b class="sl-etiqueta" style="color:var(--exito)">Sí</b> Sobre verde-2, texto en tinta</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="background:#fff;border:1px solid var(--linea);color:var(--verde-2);padding:16px;height:76px;display:flex;align-items:center;font-family:var(--fuente-titulos);font-weight:600;font-size:16px">Agendá una llamada</div><div class="sl-cuerpo-ui"><b class="sl-etiqueta" style="color:var(--error)">No</b> verde-2 nunca como texto sobre blanco</div></div></div></body></html>
