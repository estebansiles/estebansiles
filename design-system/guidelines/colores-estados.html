<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--fondo)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px"><div style="display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--exito-fondo);border-top:2px solid var(--exito)"><div class="sl-etiqueta" style="color:var(--exito);font-weight:700">Listo</div><div class="sl-cuerpo-ui" style="color:var(--texto)">--exito · --exito-fondo</div></div><div style="display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--alerta-fondo);border-top:2px solid var(--alerta)"><div class="sl-etiqueta" style="color:var(--alerta);font-weight:700">Pendiente</div><div class="sl-cuerpo-ui" style="color:var(--texto)">--alerta · --alerta-fondo</div></div><div style="display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--error-fondo);border-top:2px solid var(--error)"><div class="sl-etiqueta" style="color:var(--error);font-weight:700">Error</div><div class="sl-cuerpo-ui" style="color:var(--texto)">--error · --error-fondo</div></div></div></body></html>
