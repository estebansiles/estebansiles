<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Logo — vista previa</title>
<style>body{padding:24px}.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:20px}.lbl{font:400 11px/1 var(--fuente-texto);letter-spacing:.2em;text-transform:uppercase;color:var(--texto-suave);margin-bottom:8px}</style></head>
<body>
<div id="root"></div>
<script>
  var S = window.SilesDesignSystem_ba437f, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render((function () {
    var caja = function (fondo, alto, hijo, i) {
      return h('div', {key: i, style: {background: fondo, height: alto, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid var(--linea)'}}, hijo);
    };
    var logos = [['color', 'var(--blanco)'], ['tinta', 'var(--blanco)'], ['verde', 'var(--blanco)'], ['blanco', 'var(--tinta)'], ['blanco-pleno', 'var(--verde-1)'], ['blanco-pleno', 'var(--tinta)']];
    var isos = [['color', 'var(--blanco)'], ['tinta', 'var(--blanco)'], ['verde', 'var(--blanco)'], ['blanco', 'var(--tinta)'], ['blanco-pleno', 'var(--verde-1)']];
    return h('div', {className: 'col', style: {gap: 16}},
      h('div', {style: {display: 'grid', gridTemplateColumns: 'repeat(3,minmax(0,1fr))', gap: 16}},
        logos.map(function (l, i) { return caja(l[1], 130, h(S.Logo, {variante: l[0], alto: 56}), i); })),
      h('div', {style: {display: 'grid', gridTemplateColumns: 'repeat(5,minmax(0,1fr))', gap: 16}},
        isos.map(function (l, i) { return caja(l[1], 120, h(S.Logo, {tipo: 'isotipo', variante: l[0], alto: 80}), i); })));
  })());
</script>
</body>
</html>
