<!-- @dsCard group="Sitio web" viewport="1280x800" name="Sitio web" subtitle="Inicio · Servicios · Cotización · Contacto" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siles Comunicación</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Encabezado.jsx"></script>
<script type="text/babel" src="Pie.jsx"></script>
<script type="text/babel" src="Inicio.jsx"></script>
<script type="text/babel" src="Servicios.jsx"></script>
<script type="text/babel" src="VistaCotizacion.jsx"></script>
<script type="text/babel" src="Contacto.jsx"></script>
<script type="text/babel">
function App(){
  const [vista,setVista]=React.useState(localStorage.getItem('siles-vista')||'inicio');
  const ir=v=>{setVista(v);localStorage.setItem('siles-vista',v);window.scrollTo(0,0);};
  return (<><Encabezado vista={vista} ir={ir}/><main data-screen-label={vista}>
    {vista==='inicio'&&<Inicio ir={ir}/>}{vista==='servicios'&&<Servicios ir={ir}/>}{vista==='cotizacion'&&<VistaCotizacion/>}{vista==='contacto'&&<Contacto/>}
  </main><Pie/></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
